<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>巨人の足跡 火の国編</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* レイアウト：上＝携帯機の画面（160×144を整数倍）、下＝FC型の操作盤。HUDは画面の外に出し、画面内は絵と窓だけにする */
:root{
  box-sizing:border-box;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* 深海 / 流木 / 珊瑚 / 浅瀬 / 砂 / 墨 */
  --shell:#12324a; --shell-2:#0c2436; --trim:#c9a878; --ink:#f1e2b8; --dim:#9db4c4;
  --coral:#ef6f5a; --shoal:#58c4c0; --ki:#f6c945; --sumi:#0d1626; --key:#1d4a69; --key-hi:#2b6187; --key-ink:#f1e2b8;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --shell:#d9c7a0; --shell-2:#c4ae82; --trim:#12324a; --ink:#12324a; --dim:#4a5f6e;
    --key:#12324a; --key-hi:#1d4a69; --ki:#a8780a; --shoal:#1f8a86;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --shell:#d9c7a0; --shell-2:#c4ae82; --trim:#12324a; --ink:#12324a; --dim:#4a5f6e;
  --key:#12324a; --key-hi:#1d4a69; --ki:#a8780a; --shoal:#1f8a86;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --shell:#12324a; --shell-2:#0c2436; --trim:#c9a878; --ink:#f1e2b8; --dim:#9db4c4;
  --key:#1d4a69; --key-hi:#2b6187; --ki:#f6c945; --shoal:#58c4c0;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--shell);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--shoal);outline-offset:2px}

#game-shell{height:100%;display:flex;flex-direction:column;align-items:center;max-width:680px;margin:0 auto}

/* ---- HUD ---- */
#hud{flex:0 0 auto;width:100%;padding:8px 16px 6px;display:flex;flex-direction:column;gap:5px;line-height:1}
#hud .r1{display:flex;align-items:center;gap:9px;font-size:14px}
#hud .nm,#hud .gd{white-space:nowrap}
#hud .st{display:flex;align-items:center;gap:5px;min-width:0}
#hud .hp{flex:1.5}#hud .mp{flex:1}
#hud .bar{flex:1;height:10px;background:var(--shell-2);border:2px solid var(--trim);min-width:22px}
#hud .bar i{display:block;height:100%;width:100%;background:var(--shoal);transition:width .25s}
#hud .bar i.low{background:var(--coral)}
#hud .mp .bar i{background:var(--ki)}
#hud b{font-weight:400}
.r2{display:flex;align-items:center;gap:8px;font-size:12px;min-width:0}
#hArea{flex:0 0 auto;padding:3px 7px;border:1px solid var(--trim);border-radius:3px;white-space:nowrap}
#hGoal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
#hGoal::before{content:"◆ ";color:var(--coral)}

/* ---- Screen ---- */
#stage{flex:0 0 auto;width:100%;display:flex;justify-content:center;padding:0 8px}
#screen{
  box-sizing:content-box;position:relative;width:320px;height:288px;--u:2px;
  background:#000;border:3px solid var(--trim);border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 4px var(--shell-2);
}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#screen.shake{animation:shake .32s steps(6)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,3px)}}
@media (prefers-reduced-motion: reduce){#screen.shake{animation:none}}

.win{
  background:var(--sumi);color:#fff;
  border:calc(var(--u)*1) solid #fff;border-radius:calc(var(--u)*2);
  box-shadow:0 0 0 calc(var(--u)*1) var(--sumi);
}
#dlg{
  position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*3);
  min-height:calc(var(--u)*43);padding:calc(var(--u)*4) calc(var(--u)*5);
  font-size:calc(var(--u)*7.6);line-height:1.45;white-space:pre-wrap;
}
#dname{
  position:absolute;left:calc(var(--u)*4);top:calc(var(--u)*-8.5);
  padding:0 calc(var(--u)*3);font-size:calc(var(--u)*6.4);line-height:1.5;
  background:var(--sumi);border:calc(var(--u)*1) solid #fff;border-radius:calc(var(--u)*2);color:#ffd98a;
}
#dnext{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*1.5);font-size:calc(var(--u)*6);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(calc(var(--u)*1.5))}}
#choice{
  position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*3);
  display:flex;flex-direction:column;padding:calc(var(--u)*2);
  font-size:calc(var(--u)*7.6);min-width:calc(var(--u)*54);
}
#choice.grid{left:calc(var(--u)*3);display:grid;grid-template-columns:1fr 1fr}
#choice button{
  text-align:left;padding:calc(var(--u)*4) calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*10);
  position:relative;color:#fff;min-height:calc(var(--u)*19);white-space:nowrap;
}
#choice.grid button{padding-block:calc(var(--u)*2.2);min-height:calc(var(--u)*15)}
#choice button.sel{background:#1b2a47}
#choice button.sel::before{content:"▶";position:absolute;left:calc(var(--u)*2);color:#ffd98a}
#choice button:active{background:#22304d}
#tin{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*54);display:flex;gap:calc(var(--u)*2);padding:calc(var(--u)*2)}
#tin input{flex:1;min-width:0;font:inherit;font-size:max(16px,calc(var(--u)*7.6));background:#fff;color:#0d1626;border:0;border-radius:calc(var(--u)*1.5);padding:calc(var(--u)*2) calc(var(--u)*3);-webkit-user-select:text;user-select:text}
#tin button{color:#fff;border:calc(var(--u)*.8) solid #fff;border-radius:calc(var(--u)*2);padding:0 calc(var(--u)*5);font-size:calc(var(--u)*7.6)}
#toast{
  position:absolute;top:calc(var(--u)*4);left:50%;transform:translateX(-50%);
  padding:calc(var(--u)*1) calc(var(--u)*6);font-size:calc(var(--u)*7);white-space:nowrap;
  opacity:0;transition:opacity .4s;pointer-events:none;z-index:3;
}
#toast.on{opacity:1}

/* ---- 戦闘の重ね表示（行動予告・ダメージ数字） ---- */
#bui{position:absolute;inset:0;pointer-events:none}
#bui .tag{
  position:absolute;transform:translateX(-50%);white-space:nowrap;
  font-size:calc(var(--u)*5.8);line-height:1.45;padding:0 calc(var(--u)*2.5);
  background:#0d1626;border:calc(var(--u)*.7) solid currentColor;border-radius:calc(var(--u)*1.5);
}
#bturn{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*3);font-size:calc(var(--u)*5.6);line-height:1.4;padding:0 calc(var(--u)*2.5);background:#0d1626;color:#9fd6d3;border-radius:calc(var(--u)*1.5)}
.pop{
  position:absolute;transform:translate(-50%,0);white-space:nowrap;
  font-size:calc(var(--u)*11);color:#fff;
  text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #0d1626,calc(var(--u)*-1) calc(var(--u)*-1) 0 #0d1626,calc(var(--u)*1) calc(var(--u)*-1) 0 #0d1626,calc(var(--u)*-1) calc(var(--u)*1) 0 #0d1626;
  animation:pop .75s steps(8) forwards;
}
.pop.crit{color:#ffd98a;font-size:calc(var(--u)*15)}
.pop.dull{color:#9fb0c8;font-size:calc(var(--u)*9)}
.pop.hurt{color:#ff8a7a}
.pop.heal{color:#8fe8b0}
@keyframes pop{0%{transform:translate(-50%,0)}35%{transform:translate(-50%,calc(var(--u)*-10))}100%{transform:translate(-50%,calc(var(--u)*-14));opacity:0}}
@media (prefers-reduced-motion: reduce){.pop{animation-duration:.01s}}

#mini{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*35.2);height:calc(var(--u)*28.8);image-rendering:pixelated;image-rendering:crisp-edges;border:calc(var(--u)*.8) solid #fff;box-shadow:0 0 0 calc(var(--u)*.8) #0d1626;opacity:.92}

#pause{position:absolute;inset:0;z-index:5;background:#0d1626cc;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
#pause div{padding:calc(var(--u)*6) calc(var(--u)*12);font-size:calc(var(--u)*10);line-height:1.6}
#pause small{font-size:calc(var(--u)*6);color:#9fd6d3}

#title{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u)*3);background:linear-gradient(#0d1626cc,#0d162655 55%,#0d1626dd);color:#fff;text-align:center;
}
#title h1{margin:0;font-weight:400;font-size:calc(var(--u)*19);letter-spacing:.08em;line-height:1.15;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #0d1626}
#title p{margin:0;font-size:calc(var(--u)*6.6);color:#ffd98a}
#title .btns{display:grid;grid-template-columns:1fr;gap:calc(var(--u)*3);margin-top:calc(var(--u)*6)}
#title button{font-size:calc(var(--u)*7.6);padding:calc(var(--u)*3.4) calc(var(--u)*16);color:#fff;white-space:nowrap}
#title button.wide{grid-column:1/3}
#title button:active{background:#22304d}
#title button:disabled{opacity:.38}

#menu{
  position:absolute;inset:calc(var(--u)*4);padding:calc(var(--u)*4) calc(var(--u)*5);z-index:4;
  font-size:calc(var(--u)*7);line-height:1.6;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
}
#menu h2{margin:0 0 calc(var(--u)*2);font-weight:400;font-size:calc(var(--u)*8);color:#ffd98a}
#menu .goal{margin:calc(var(--u)*3) 0;padding-top:calc(var(--u)*3);border-top:calc(var(--u)*.6) dashed #fff8}
#menu .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.5);margin-bottom:calc(var(--u)*3)}
#menu .tabs button{border:calc(var(--u)*.8) solid #fff9;border-radius:calc(var(--u)*2);min-height:calc(var(--u)*13);color:#fff;font-size:calc(var(--u)*6.4)}
#menu .tabs button.on{background:#fff;color:var(--sumi)}
#menu .tabs button:disabled{opacity:.35}
#menu .ln{display:flex;align-items:center;gap:calc(var(--u)*3)}
#menu .ln .k{color:#9fd6d3;flex:0 0 calc(var(--u)*24)}
#menu .mb{flex:1;height:calc(var(--u)*5);background:#22304d;border:calc(var(--u)*.6) solid #fff}
#menu .mb i{display:block;height:100%;background:#58c4c0}
#menu .mb i.x{background:#ffd98a}
#menu .mb i.k2{background:#f6c945}
#menu .mb i.low{background:#ef6f5a}
#menu .two{display:grid;grid-template-columns:1fr 1fr;gap:0 calc(var(--u)*4)}
#menu .sm{color:#9fd6d3;font-size:calc(var(--u)*6)}
#menu h3{margin:calc(var(--u)*3) 0 0;font-weight:400;font-size:calc(var(--u)*6.4);color:#ffd98a;border-bottom:calc(var(--u)*.6) solid #fff5}
#menu .it{display:flex;align-items:center;width:100%;text-align:left;gap:calc(var(--u)*2);color:#fff;min-height:calc(var(--u)*15);border-bottom:calc(var(--u)*.5) dashed #fff3}
#menu button.it:active{background:#22304d}
#menu .it .e{flex:0 0 calc(var(--u)*8);color:#0d1626;background:#ffd98a;text-align:center;border-radius:calc(var(--u)*1.5);line-height:1.3}
#menu .it .e.off{background:none;color:#58c4c0}
#menu .it .fx{margin-left:auto;color:#9fd6d3;white-space:nowrap}
#menu .zk{padding:calc(var(--u)*2) 0;border-bottom:calc(var(--u)*.5) dashed #fff3}
#menu .zk .nm{display:flex;justify-content:space-between;gap:calc(var(--u)*3)}
#mMap{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;border:calc(var(--u)*.8) solid #fff;margin-top:calc(var(--u)*2)}
#menu .row{display:flex;flex-wrap:wrap;gap:calc(var(--u)*3);margin-top:calc(var(--u)*3)}
#menu .row button{border:calc(var(--u)*.8) solid #fff;border-radius:calc(var(--u)*2);padding:calc(var(--u)*3) calc(var(--u)*5);color:#fff;min-height:calc(var(--u)*17)}
#menu .row button.on{background:#fff;color:var(--sumi)}
#menu .row button:disabled,#menu button.it:disabled{opacity:.4}
#menu .row button.warn{border-color:#ef6f5a;color:#ef6f5a}

/* ---- タイトルコール ---- */
/* 帯も文字も同じ -6度に乗せる。上の札＝章の前置き、下の札＝章名。背景は流れる縦縞で勢いを出す */
#tc{position:absolute;inset:0;z-index:4;background:#05080f;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center}
#tc .bgst{position:absolute;inset:-30%;transform:skewX(-24deg);opacity:0;
  background:repeating-linear-gradient(90deg,#0d1f3a 0 calc(var(--u)*5),#05080f calc(var(--u)*5) calc(var(--u)*16),#12324a calc(var(--u)*16) calc(var(--u)*17),#05080f calc(var(--u)*17) calc(var(--u)*26));
  background-size:calc(var(--u)*26) 100%;animation:tcIn .3s .25s forwards,tcBg .9s steps(13) infinite}
#tc .bar{position:absolute;left:0;right:0;height:calc(var(--u)*11);background:#000;display:flex;align-items:center;padding:0 calc(var(--u)*5);font-size:calc(var(--u)*4.6);letter-spacing:.32em;color:#c9a878;white-space:nowrap}
#tc .bar.t{top:0;border-bottom:calc(var(--u)*.8) solid #c9a878;animation:tcBt .3s both}
#tc .bar.b{bottom:0;border-top:calc(var(--u)*.8) solid #c9a878;justify-content:flex-end;animation:tcBb .3s both}
#tc .slash{position:absolute;left:-20%;right:-20%;top:50%;height:calc(var(--u)*46);margin-top:calc(var(--u)*-23);overflow:hidden;
  background:linear-gradient(#f58a6e 0 8%,#ef6f5a 8% 64%,#d2503f 64% 100%);transform:skewY(-6deg);animation:tcSl .38s cubic-bezier(.2,.9,.2,1) both}
#tc .slash::after{content:"";position:absolute;left:0;right:0;bottom:calc(var(--u)*3);height:calc(var(--u)*.8);background:#ffd98a}
#tc .shine{position:absolute;top:0;bottom:0;left:0;width:calc(var(--u)*16);background:#fff;opacity:.28;transform:translateX(-200%) skewX(-30deg);animation:tcSh 2.6s 1.5s steps(24) infinite}
#tc .edge{position:absolute;left:-20%;right:-20%;top:50%;height:calc(var(--u)*1.5);background:#fff;transform:skewY(-6deg);animation:tcSr .5s .15s cubic-bezier(.2,.9,.2,1) both}
#tc .edge.a{margin-top:calc(var(--u)*-27)}#tc .edge.b{margin-top:calc(var(--u)*25.5)}
#tc .tc-in{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;transform:skewY(-6deg)}
#tc .tc-sub{align-self:flex-start;margin:0 0 calc(var(--u)*14) calc(var(--u)*9);padding:0 calc(var(--u)*4);background:#fff;color:#05080f;font-size:calc(var(--u)*7.4);line-height:1.5;letter-spacing:.22em;
  box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #ef6f5a;animation:tcL .4s .3s cubic-bezier(.2,.9,.2,1) both}
#tc h2{margin:0;font-weight:400;font-size:calc(var(--u)*25);letter-spacing:.06em;line-height:1.16;white-space:nowrap;
  text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #7a2a22,calc(var(--u)*3) calc(var(--u)*3) 0 #05080f;animation:tcR .45s .5s cubic-bezier(.15,1.25,.3,1) both}
#tc h2.s{font-size:calc(var(--u)*20)}
#tc .tc-name{position:absolute;top:100%;right:calc(var(--u)*9);margin-top:calc(var(--u)*15);white-space:nowrap;display:flex;align-items:center;gap:calc(var(--u)*3);font-size:calc(var(--u)*9);line-height:1.3;color:#ffd98a;letter-spacing:.2em;animation:tcRr .4s 1.15s cubic-bezier(.2,.9,.2,1) both}
#tc .tc-name::before{content:"";width:calc(var(--u)*18);height:calc(var(--u)*1);background:#ffd98a}
#tc .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:tcF .5s .92s both;pointer-events:none}
#tc .tc-next{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*13);font-size:calc(var(--u)*6);animation:bob .7s steps(2) infinite}
@keyframes tcSl{from{transform:translateX(-130%) skewY(-6deg)}}
@keyframes tcSr{from{transform:translateX(130%) skewY(-6deg)}}
@keyframes tcL{from{transform:translateX(-150%);opacity:0}}
@keyframes tcRr{from{transform:translateX(150%);opacity:0}}
@keyframes tcR{from{transform:translateX(150%) skewX(-20deg)}}
@keyframes tcF{0%{opacity:.9}100%{opacity:0}}
@keyframes tcIn{to{opacity:1}}
@keyframes tcBg{to{background-position:calc(var(--u)*-26) 0}}
@keyframes tcBt{from{transform:translateY(-100%)}}
@keyframes tcBb{from{transform:translateY(100%)}}
@keyframes tcSh{0%{transform:translateX(-200%) skewX(-30deg)}45%,100%{transform:translateX(1400%) skewX(-30deg)}}
@media (prefers-reduced-motion: reduce){#tc *{animation:none!important}#tc .bgst{opacity:1}}

/* ---- 操作盤（常時表示・ラベルだけ状況で変わる） ---- */
#control-deck{
  flex:1 1 auto;min-height:172px;width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 12px;gap:6px;
}
#dpad{position:relative;width:min(38vw,148px);height:min(38vw,148px);touch-action:none;flex:0 0 auto}
#dpad i{position:absolute;background:var(--key);pointer-events:none}
#dpad .u,#dpad .d{left:33.8%;width:32.4%;height:35.1%}
#dpad .l,#dpad .r{top:33.8%;height:32.4%;width:35.1%}
#dpad .u{top:0;border-radius:10px 10px 0 0}#dpad .d{bottom:0;border-radius:0 0 10px 10px}
#dpad .l{left:0;border-radius:10px 0 0 10px}#dpad .r{right:0;border-radius:0 10px 10px 0}
#dpad .c{left:33.8%;top:33.8%;width:32.4%;height:32.4%}
#dpad i::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;color:var(--key-ink);opacity:.75}
#dpad .u::after{content:"▲"}#dpad .d::after{content:"▼"}#dpad .l::after{content:"◀"}#dpad .r::after{content:"▶"}
#dpad[data-d="up"] .u,#dpad[data-d="down"] .d,#dpad[data-d="left"] .l,#dpad[data-d="right"] .r{background:var(--key-hi)}
#mid{display:flex;flex-direction:column;gap:14px;align-items:center;align-self:center;padding-top:34px;flex:0 0 auto}
.pill{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:44px;min-height:34px;justify-content:flex-end}
.pill b{display:block;width:38px;height:13px;border-radius:7px;background:var(--key)}
.pill:active b{background:var(--key-hi);transform:translateY(2px)}
.pill.off{opacity:.5}
.ab{display:flex;align-items:flex-end;gap:10px;flex:0 0 auto}
.ab button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;white-space:nowrap}
.ab b{display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:400;color:#fff}
.ab span{min-width:4.6em;text-align:center}
#bB b{width:clamp(48px,15vw,60px);height:clamp(48px,15vw,60px);background:var(--key);font-size:22px;color:var(--key-ink)}
#bA b{width:clamp(62px,20vw,82px);height:clamp(62px,20vw,82px);background:var(--coral);font-size:30px}
#bA{margin-bottom:26px}
#bA.hot b{box-shadow:0 0 0 3px var(--shell),0 0 0 5px var(--ki)}
.ab button.idle span{opacity:.45}
.ab button:active b{transform:translateY(3px);filter:brightness(1.2)}

/* ---- ハーネス契約：上75%＝#game-stage（HUD＋画面枠）／下25%＝#control-deck。操作盤はDOM先頭、見た目は order で下段へ ---- */
#game-shell{align-items:stretch}
#game-stage{order:1;flex:0 0 75%;min-height:0;display:flex;flex-direction:column;align-items:center}
#screen-wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:var(--shell-2);border-block:2px solid var(--trim)}

#dpad{order:1;width:min(38vw,148px,19vh);height:min(38vw,148px,19vh)}
#mid{order:2;padding-top:0;gap:6px}
.ab{order:3}#bB{order:1}#bA{order:2;margin-bottom:max(0px,min(26px,3vh))}
.pill{min-width:48px;min-height:48px}
.r2{width:calc(var(--sw,320px) + 6px);max-width:100%;align-items:flex-start;font-size:13px;line-height:1.35;min-height:36px}
#hGoal{white-space:normal;overflow:visible;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-height:620px){.ab b{transform:scale(.86)}.ab button{gap:1px}}

const bgm={k:null,i:0,t:0};let nzBuf=null;

function voice(f,t,d,type,v){
  const os=AC.createOscillator(),gn=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
  gn.gain.setValueAtTime(v,t);gn.gain.setValueAtTime(v,t+d*.6);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(gn);gn.connect(AC.destination);os.start(t);os.stop(t+d+.02);
}
function drum(ch,t){
  if(!nzBuf){nzBuf=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);const a=nzBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  if(ch==='k'){const os=AC.createOscillator(),gn=AC.createGain();os.type='triangle';os.frequency.setValueAtTime(140,t);os.frequency.exponentialRampToValueAtTime(45,t+.09);
    gn.gain.setValueAtTime(.09,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.1);os.connect(gn);gn.connect(AC.destination);os.start(t);os.stop(t+.12);return}
  const s=AC.createBufferSource(),gn=AC.createGain(),d=ch==='s'?.09:.03;s.buffer=nzBuf;
  gn.gain.setValueAtTime(ch==='s'?.035:.016,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(gn);gn.connect(AC.destination);s.start(t);s.stop(t+d+.01);
}
function setBgm(k){if(bgm.k===k)return;bgm.k=k;bgm.i=0;bgm.t=0}
function bgmTick(){
  try{
    if(!AC||mute||paused||!set.bgm||!bgm.k||AC.state!=='running'||document.hidden){bgm.t=0;return}
    const s=SONGS[bgm.k],sp=30/s.bpm,now=AC.currentTime;
    if(bgm.t<now)bgm.t=now+.04;
    while(bgm.t<now+.3){
      const i=bgm.i%32,m=s.m[i],b=s.b[i],dc=s.dr[i%16];
      if(m){let d=sp;for(let j=i+1;j<32&&!s.m[j]&&d<sp*4;j++)d+=sp;voice(mf(m),bgm.t,d*.95,s.mw||'square',s.mv||.028);if(s.oct)voice(mf(m-12),bgm.t,d*.95,'sine',.06)}
      if(b){let bd=sp;if(s.nh)for(let j=i+1;j<32&&!s.b[j]&&bd<sp*4;j++)bd+=sp;voice(mf(b),bgm.t,bd*.9,'triangle',s.bv||.07);if(i%2===0&&!s.nh)voice(mf(b+19),bgm.t,sp*.5,'square',.009)}
      if(dc&&dc!=='-')drum(dc,bgm.t);
      bgm.t+=sp;bgm.i++;
    }
  }catch(e){}
}

const tile=(a,x,y)=>MAPS[a].rows[y][x];
function walkable(a,x,y){
  const c=tile(a,x,y);
  if(a==='ocean')return c==='~';
  if(a==='world')return '~.,sVYO'.includes(c)||(c==='W'&&!!flags.sail)||(c==='Q'&&!!flags.nushi);
  return '.,sfF_m<>g'.includes(c);
}
function npcAt(x,y){return areaNPC().find(n=>n.x===x&&n.y===y)||null}
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};

function tryMove(d){
  hero.dir=d;const nx=hero.x+DV[d][0],ny=hero.y+DV[d][1];
  if(nx<0||ny<0||nx>=mw(area)||ny>=mh(area)){
    if(area==='ocean'||area==='world'){run(()=>say('','霧が濃くて\nこれ以上は 進めない……'));return}
    if(area==='pipopa'){run(()=>changeArea('world',VIL[0],VIL[1],'down'));return}
    if(area.startsWith('pin')){const r=RET[area];run(()=>changeArea('pipopa',r[0],r[1],'down'));return}
    if(area==='hide1'){run(()=>changeArea('world',HIDE[0],HIDE[1],'down'));return}
    if(area==='keep'){run(()=>changeArea('castle',4,3,'down'));return}
    if(area==='castle'){run(()=>changeArea('world',CAS[0],CAS[1],'down'));return}
    if(area.startsWith('hide'))return;
    const m=MAPS[area],nb=Object.keys(MAPS).find(k=>MAPS[k].gx===m.gx+DV[d][0]&&MAPS[k].gy===m.gy+DV[d][1]);
    if(!nb)return;
    const wx=(nx+MW)%MW,wy=(ny+MH)%MH;
    if(walkable(nb,wx,wy))run(()=>changeArea(nb,wx,wy));
    return;
  }
  const c=tile(area,nx,ny);
  if(bump(c))return;
  if(area==='world'){
    const W_=mw('world');
    const isW=q=>q==='~'||q==='W';
    if(isW(c)&&nx<=10&&ny>=28&&!flags.sail){toast('潮が 逆巻いて 西へは 進めない');return}
    if(c==='~'&&deep[ny*W_+nx]&&!deep[hero.y*W_+hero.x]&&!flags.afloat&&!flags.sail){toast('海流が はげしくて 沖へは 出られない');return}
    const cur=tile(area,hero.x,hero.y),cw=isW(cur),nw=isW(c);
    if(cw!==nw&&(cw?c:cur)!=='s'){if(cw&&'.,VTMYOQG'.includes(c))toast('上陸できるのは 砂地だけ');return}
  }
  if(walkable(area,nx,ny)&&!npcAt(nx,ny)){hero.tx=nx;hero.ty=ny;hero.t=0;hero.moving=true}
}
async function changeArea(nb,x,y,dir){

  if(nb==='world')reveal();
  toast(MAPS[nb].name);setBgm(bgmFor());save();await fadeTo(0,130);
}
function bump(c){
  if(c==='B'&&!flags.q)return false;
  if((c==='W'&&flags.sail)||(c==='Q'&&flags.nushi))return false;
  const ev={D:restEv,B:raftEv,P:landEv,W:whirlEv,Z:banditEv,C:chestEv,d:keepEv,Q:fireEv,G:giantEv}[c];
  if(ev){run(ev);return true}
  if('1234'.includes(c)){run(()=>changeArea('pin'+c,4,8,'up'));return true}
  return false;
}
function examText(c){
  if(area==='keep')return {p:flags.keitai?'からっぽの 台だ。\n「携帯 売約済」の 札が\n立っている。':'うすい 光る板が かざってある。\nピ・ポ・パ……と\n小さく 鳴っている。',
    I:'南蛮わたりの 地球儀だ。\n棚には「関所の 通行料の 札」\n「六本腕の ぬけがら」も ある。',
    E:'南蛮の 鉄の よろいだ。\nなぜか 頭に ちょんまげの\nかつらが のせてある。',
    S:'金の しゃちほこだ。\nギラギラして 目が いたい。',
    L:'南蛮の 燭台だ。\nロウソクが 三本 燃えている。\n畳に ロウが たれている……。',
    U:'大きな 伊万里の つぼだ。\n中に ぶどう酒が\nなみなみ 入っている。',
    b:'食べかけの だんごと、\n「めずらしきもの 帳」が\n置いてある。',
    q:'からくりの 部品箱だ。\nネジが ひとつ 余っている。\n……いいのだろうか。'}[c];
  if(area.startsWith('pin')){
    if(c==='z')return area==='pin3'?'Zzz……\n先客が 寝言を言っている。\n「ナット……ボルト……おかわり……」':'鉄わたの ふとんだ。\nずっしり 重い。';
    return {b:'さびたクギの 煮込みと、\nネジの おひたしだ。\nピポパ族の ごちそうらしい。',
      I:'鉄くずが 味べつに 並んでいる。\n「赤サビ味」「黒サビ味」\n「ピカピカ（高級）」……',
      q:'ザザ……ピポ……パポ……\n通信機が どこかと 交信している。',
      p:'代々の「携帯」が\nまつられていた台だ。\nいまは からっぽ……。'}[c];
  }
  if(area.startsWith('hide'))return {h:'たき火が パチパチ 燃えている。\nあたたかい。'}[c];
}
function onStep(){
  steps++;sinceB++;
  const c=tile(area,hero.x,hero.y);
  if(c==='F'&&!flags.foot){run(footEv);return}
  if(c==='>'||c==='<'){const to='hide'+(+area.slice(4)+(c==='>'?1:-1)),q=findTile(to,c==='>'?'<':'>');run(()=>changeArea(to,q[0],q[1]));return}
  if(area==='castle'&&c==='g'&&flags.gate===1&&hero.dir==='down'){run(gateBackEv);return}
  let enc=MAPS[area].enc,bg=area.startsWith('hide')?'cave':area,rate=area.startsWith('hide')?.09:.115;
  if(area==='world'){
    reveal();setBgm(bgmFor());
    if(c==='V'){flags.pv=1;run(()=>changeArea('pipopa',4,8,'up'));return}
    if(c==='O'){run(()=>changeArea('castle',4,8,'up'));return}
    if(c==='Y'){run(async()=>{await changeArea('hide1',4,8,'up');if(!flags.guard)await guardEv()});return}
    if(c==='s'&&hero.x>=33&&hero.y>=22&&hero.y<=25&&!flags.kuju){flags.kuju=1;toast('九十九里浜')}
    if(flags.afloat&&!flags.sail&&(!flags.teaser||Math.hypot(hero.x-HOME[0],hero.y-HOME[1])>=3)){run(driftEv);return}
    rate=.07;
    if(c==='~'||c==='W'){enc=['jelly'];bg='ocean'}
    else if(hero.x<=7&&hero.y>=29){enc=['hidama','magani','hidama'];bg='volc';if(!flags.hinokuni){flags.hinokuni=1;toast('火の国');save()}}
    else{enc=hero.x<=24?['tsuchi','bigmush','wasp','tsuchi']:['wasp','bigmush','mush'];bg=c==='s'?'coast':'meadow'}
  }
  if(enc&&flags.morn!==1&&sinceB>4&&Math.random()<rate){const k=enc[rnd(0,enc.length-1)];run(()=>fieldBattle(k,bg));return}
  if(steps%12===0)save();
}
function interact(){
  const dx=DV[hero.dir][0],dy=DV[hero.dir][1],fx=hero.x+dx,fy=hero.y+dy,inb=(x,y)=>x>=0&&y>=0&&x<mw(area)&&y<mh(area);
  if(inb(fx,fy)){
    const c=tile(area,fx,fy);let n=npcAt(fx,fy);
    if(!n&&c==='c'&&inb(fx+dx,fy+dy))n=npcAt(fx+dx,fy+dy);
    if(n){n.dir={up:'down',down:'up',left:'right',right:'left'}[hero.dir];run(()=>n.ev?n.ev():talk(n.id));return}
    if(bump(c))return;
    const ex=examText(c);if(ex){run(()=>say('',ex));return}
  }
  if(tile(area,hero.x,hero.y)==='F')run(footEv);
}

async function shopEv(){
  if(await ask('武器屋','へい、らっしゃい。\n旅の支度は 済んでるかい。\n何か 買うかい？')!==0){await say('武器屋','また 寄ってくれよ。');return}
  for(;;){
    await say('武器屋',`どれに する？\n（もっている貝：${P.gold}）`,{keep:true});
    const c=await choose(['武器 ステレスの爪 200','防具 ランニングと短パン 140','道具 やくそう 15','やめる']);hideDlg();
    if(c===3)break;
    if(c===2){
      if(P.herb>=9){await say('武器屋','そんなに 持てねえだろ。');continue}
      if(P.gold<15){await say('武器屋','おっと、貝が 足りねえな。');continue}
      P.gold-=15;P.herb++;SE.get();await say('',`やくそうを 買った！（${P.herb}こ）`);continue;
    }
    const it=c===0?{k:'claw',n:'ステレスの爪',p:200,m:'攻撃力が 上がった！'}:{k:'wear',n:'ランニングと短パン',p:140,m:'防御力が 上がった！'};
    if(flags[it.k]){await say('武器屋','そいつは もう 持ってるぜ。');continue}
    if(P.gold<it.p){await say('武器屋','おっと、貝が 足りねえな。');continue}
    P.gold-=it.p;flags[it.k]=1;P.eq[ITEMS[it.k].slot]=it.k;SE.get();
    await say('',`${it.n}を 手に入れた！\nさっそく 装備した。${it.m}`);
  }
  await say('武器屋','ありがとよ。');save();
}
function askText(){

  let res=null,stun='',psn=0;
  const strike=(tg,mul,o={})=>{
    const cr=Math.random()<(o.cr||1/12),km=tg.next==='kamae'&&!o.pierce,gd=(tg.next==='grd'&&!o.pierce)||km;
    let dm=Math.max(1,Math.round((atk()-(o.pierce?0:tg.def>>1)+rnd(0,3))*mul));if(cr)dm*=2;if(gd)dm=Math.max(1,dm>>1);
    cr?SE.crit():SE.hit();tg.blink=320;tg.hp=Math.max(0,tg.hp-dm);pop(tg,dm,cr?'crit':gd?'dull':'');
    let ct='';
    if(km&&tg.hp>0){const c=Math.min(Math.max(1,Math.round(tg.atk*.5)),P.hp-1);if(c>0){P.hp-=c;pop(null,'-'+c,'hurt');shake();ct=`\n槍ぶすまの 返し突き！ ${c}の ダメージ！`}}
    if(o.short)return `${tg.label}に ${dm}！`+ct;
    return (cr?'かいしんの 一撃！！':(o.name||'あなたの 攻撃！'))+`\n${tg.label}に ${dm}の ダメージ！`+(ct||(gd?'\n（まもりで 半減された）':''));
  };
  const fell=async()=>{
    for(const e of es)if(e.hp<=0&&!e.dying){e.dying=true;e.next=null;P.zukan[e.key]++;P.mp=Math.min(P.mmp,P.mp+1);SE.win();await say('',`${e.label}を たおした！`)}
  };
  const pick=async()=>{
    const al=alive();if(al.length<2)return al[0];
    const i=await choose(al.map(e=>e.label).concat('もどる'),{cancel:al.length});
    return i===al.length?null:al[i];
  };
  while(!res){
    es.forEach(e=>{if(e.hp>0&&!e.next)e.next=rollInt(e)});
    for(const e of alive())if(TELL[e.next]&&!e.told){e.told=true;SE.thud();await say('',e.label+TELL[e.next])}
    let guard=false;
    if(stun){const m=stun;stun='';await say('',m)}
    else for(;;){
      const c=await choose(['こうげき',`わざ 気${P.mp}`,'まもる',`やくそう ${P.herb}`,'ようす','にげる'],{grid:true});
      if(c===0){const tg=await pick();if(!tg)continue;await say('',strike(tg,1));await fell();break}
      if(c===1){
        const sk=SKILLS.filter(s=>P.lv>=s.lv);
        const i=await choose(sk.map(s=>`${s.n} 気${s.mp}`).concat('もどる'),{grid:true,cancel:sk.length});
        if(i===sk.length)continue;
        const s=sk[i];
        if(P.mp<s.mp){await say('',`気力が 足りない！\n（${s.n}：${s.d}）`);continue}
        if(s.k==='nagi'){
          P.mp-=s.mp;SE.whoosh();let t='なぎ払い！';
          for(const e of alive())t+='\n'+strike(e,.75,{short:1});
          await say('',t);await fell();break;
        }
        const tg=await pick();if(!tg)continue;
        P.mp-=s.mp;
        if(s.k==='kon')await say('',strike(tg,1.7,{name:'渾身うち！'}));
        else if(s.k==='kuzu'){
          const g0=tg.next==='grd'||tg.next==='kamae';let t=strike(tg,1.2,{name:'盾くずし！',pierce:1});
          if(tg.hp>0&&(g0||Math.random()<.4)){tg.next='stun';t+=`\n${tg.label}は よろめいた！`}
          await say('',t);
        }else await say('',strike(tg,2.6,{name:'島一番の 一撃！！',cr:.3}));
        await fell();break;
      }
      if(c===2){guard=true;SE.parry();await say('','あなたは 身を守っている。');break}
      if(c===3){
        if(P.herb<=0){await say('','やくそうを 持っていない！');continue}
        if(P.hp>=P.mhp){await say('','HPは 満タンだ。');continue}
        P.herb--;const h=Math.min(herbHeal(),P.mhp-P.hp);P.hp+=h;SE.heal();pop(null,'+'+h,'heal');
        await say('',`やくそうを 使った！\nHPが ${h} 回復した！`);break;
      }
      if(c===4){
        for(const e of alive())await say(e.label,`HP ${e.hp}/${e.mhp}　攻${e.atk} 守${e.def}`+(e.tip?'\nくせ：'+e.tip:'')+(e.next==='big'?'\n力を ためている！':''));
        continue;
      }
      if(opt.noRun){await say('','これは 真剣勝負だ。\n逃げるわけには いかない！');continue}
      if(Math.random()<.65){SE.run();await say('','うまく 逃げきれた！');res='run';break}
      await say('','しかし まわりこまれてしまった！');break;
    }
    if(res)break;
    if(!alive().length){
      bt.show=false;
      if(!opt.noReward){
        const ex=es.reduce((a,e)=>a+e.exp,0),gd=es.reduce((a,e)=>a+e.g,0);
        P.exp+=ex;P.gold+=gd;
        await say('',`経験値 ${ex}、貝がら ${gd}まいを\n手に入れた！`);
        while(P.lv<=LV.length-1&&P.exp>=LV[P.lv]){
          P.lv++;P.mhp+=5;P.atk+=2;P.def+=1;P.mmp=5+P.lv;P.hp=P.mhp;P.mp=P.mmp;SE.lvl();
          await say('',`レベルが ${P.lv}に 上がった！\n最大HP+5　攻撃+2　防御+1　気力+1`);
          const ns=SKILLS.find(s=>s.lv===P.lv);
          if(ns){SE.get();await say('',`わざ「${ns.n}」を ひらめいた！\n${ns.d}（気${ns.mp}）`)}
        }
      }
      res='win';break;
    }
    for(const e of alive()){
      const it=e.next;e.next=null;e.told=false;
      if(it==='stun'){await say('',`${e.label}は よろめいている！`);continue}
      if(it==='grd'){await say('',`${e.label}は 身を かためていた。`);continue}
      if(it==='web'){
        SE.whoosh();
        if(guard)await say('',`${e.label}は 糸を はいた！\nあなたは 盾で 糸を はらった！`);
        else{stun='糸が からまって\n動けない！';await say('',`${e.label}は 糸を はいた！\nあなたは 糸に からまった！`)}
        continue;
      }
      if(it==='spore'){
        SE.whoosh();
        if(guard)await say('',`${e.label}は 胞子を まいた！\nあなたは 息を 止めて ふせいだ！`);
        else{psn=3;await say('',`${e.label}は 胞子を まいた！\nあなたは 毒を うけた！`)}
        continue;
      }
      if(it==='fire'){   /* 壊滅的なほのお：防げない。いまは勝てない相手 */
        SE.whoosh();SE.crit();shake();P.hp=0;pop(null,'-999','hurt');
        await say('',`${e.label}は 壊滅的な ほのおを はいた！！\nあなたは 999の ダメージを うけた！`);
        await say('','あなたは 力つきた……');res='lose';break;
      }
      /* ---- 槍の技（怒った門番）---- */
      if(it==='kamae'){await say('',`${e.label}は 槍ぶすまを 解いた。`);continue}
      if(it==='tsuki'||it==='harai'||it==='ashi'){
        const one=m=>{let d=Math.max(1,Math.round(e.atk*m)-(def()>>1)+rnd(0,1));if(guard)d=Math.ceil(d/2);P.hp=Math.max(0,P.hp-d);pop(null,'-'+d,'hurt');return d};
        SE.hurt();shake();
        if(it==='tsuki'){
          const a=one(.75);await wait(160);SE.hit();const b2=one(.75);await wait(160);SE.crit();shake();const c2=one(.75);
          await say('',`${e.label}の 三段突き！\n${a}・${b2}・${c2}の ダメージを うけた！`+(guard?'\n（まもって 浅く すんだ）':''));
        }else if(it==='harai'){
          const d=one(1);let t=`${e.label}の なぎ払い！\nあなたは ${d}の ダメージを うけた！`;
          if(guard)t+='\nふんばって 気力は 守った！';else{P.mp=Math.max(0,P.mp-3);t+='\n体勢を くずされ 気力を そがれた！'}
          await say('',t);
        }else{
          const d=one(.6);let t=`${e.label}の 足払い！\nあなたは ${d}の ダメージを うけた！`;
          if(guard)t+='\nこらえて 転ばなかった！';else{stun='転ばされて\nすぐには 起き上がれない！';t+='\nあなたは 転ばされた！'}
          await say('',t);
        }
        if(P.hp<=0){await say('','あなたは 力つきた……');res='lose';break}
        continue;
      }
      const big=it==='big';
      let dm=Math.max(1,Math.round(e.atk*(big?1.7:1))-(def()>>1)+rnd(0,2));
      if(guard)dm=big?Math.max(1,Math.round(dm*.3)):Math.ceil(dm/2);
      if(opt.safe)dm=Math.min(dm,Math.max(0,P.hp-1));
      if(dm>0){
        P.hp=Math.max(0,P.hp-dm);big?SE.crit():SE.hurt();shake();pop(null,'-'+dm,'hurt');
        let t=(big?`${e.label}の 大技！！\n`:`${e.label}の 攻撃！\n`)+`あなたは ${dm}の ダメージを うけた！`;
        if(big&&guard){P.mp=Math.min(P.mmp,P.mp+2);SE.parry();t=`${e.label}の 大技！！\nあなたは みきった！　${dm}の ダメージ。\n気力が みなぎる！`}
        await say('',t);
      }else await say('',`${e.label}の 攻撃！\nあなたは ひらりと かわした！`);
      if(P.hp<=0){await say('','あなたは 力つきた……');res='lose';break}
    }
    if(res)break;
    if(psn>0){
      psn--;const d=opt.safe?0:Math.min(2,P.hp-1);
      if(d>0){P.hp-=d;pop(null,'-'+d,'hurt');await say('',`毒が まわる……\n${d}の ダメージ！`+(psn?'':'\n毒が ぬけた。'))}
    }
    P.mp=Math.min(P.mmp,P.mp+1+(guard?1:0));bt.turn++;
  }
  bt.show=false;
  await fadeTo(1,170);mode=prev;bt=null;setBgm(pbgm);if(prev!=='black')await fadeTo(0,170);else fadeA=0;
  return res;
}

/* 操作盤は常に同じ形。A/Bの下のラベルだけが「いま押すと何が起きるか」に変わる。 */
function facing(){
  const dx=DV[hero.dir][0],dy=DV[hero.dir][1],fx=hero.x+dx,fy=hero.y+dy,inb=(x,y)=>x>=0&&y>=0&&x<mw(area)&&y<mh(area);
  if(!inb(fx,fy))return null;
  if(npcAt(fx,fy))return 'はなす';
  const c=tile(area,fx,fy);

  const q=(col,a,b,w,h)=>{x.fillStyle=col;x.fillRect(a,b,w,h)},m=(col,a,b,w,h)=>{q(col,a,b,w,h);q(col,40-a-w,b,w,h)};
  const K='#3a0f14',D='#8f1d1a',Rd='#d8342a',O='#f6902a',Y='#ffd04a',H='#fff3b0';
  /* 尾の炎 */
  m(D,12,23,4,8);m(O,13,24,3,8);m(Y,14,27,1,6);m(O,10,27,2,5);m(Y,11,30,1,4);q(O,18,26,4,8);q(Y,19,28,2,7);q(H,19,31,2,2);
  /* 翼（3段の羽。外へ行くほど高く／低く） */
  [[10,11,5,7,1],[6,8,5,8,2],[2,5,5,8,3]].forEach(([a,b,w,h,k])=>{const y=b+d*k*3;
    m(K,a-1,y-1,w+1,h+2);m(Rd,a,y,w,h);m(D,a,y,w,1);m(O,a,y+h-2,w,2);m(Y,a+1,y+h,w-2,1);m(O,a+1,y+h+1,1,2);m(Y,a+3,y+h+1,1,2)});
  {const y=2+d*11;m(K,0,y,3,7);m(O,0,y+1,2,5);m(Y,0,y+2,1,3);m(H,0,y-2,1,2)}
  /* 体 */
  q(K,14,11,12,16);q(K,13,14,14,10);q(Rd,15,12,10,14);q(Rd,14,15,12,8);q(D,15,24,10,2);
  q(O,17,16,6,9);q(Y,18,18,4,6);q(H,19,19,2,3);m(D,15,14,1,6);
  /* 頭 */
  q(K,15,4,10,9);q(Rd,16,5,8,8);q(D,16,5,8,1);
  m(K,16,7,3,1);m('#ffffff',17,8,2,2);m(K,18,9,1,1);
  q(K,18,9,4,5);q(Y,19,10,2,3);q(O,19,12,2,1);
  /* とさかの炎 */
  q(O,19,0,2,5);q(Y,19,2,2,3);q(H,20,3,1,2);m(O,16,1,2,4);m(Y,17,2,1,3);m(D,14,3,1,2);
  /* 足 */
  m(K,16,26,3,5);m('#c9703a',17,26,1,4);m(Y,15,30,4,1);m(Y,16,31,1,1);
  return c;
}
SPC.nushi=birdCv(0);SPC.nushi2=birdCv(1);

function drawMap(a,t,ents){
  const m=MAPS[a].rows,w=mw(a),h=mh(a);
  const hx=(hero.x+(hero.tx-hero.x)*hero.t)*TS,hy=(hero.y+(hero.ty-hero.y)*hero.t)*TS;
  let cx=0,cy=0;
  if(ents&&!cut&&w>MW){cx=Math.max(0,Math.min(w*TS-W,Math.round(hx)-72));cy=Math.max(0,Math.min(h*TS-H,Math.round(hy)-64))}
  const x0=cx>>4,y0=cy>>4;
  for(let y=y0;y<=y0+MH&&y<h;y++)for(let x=x0;x<=x0+MW&&x<w;x++){
    const px=x*TS-cx,py=y*TS-cy;
    if(a==='world'&&!seen[y*w+x])fog(px,py,x,y);else drawTile(m[y][x],px,py,x,y,t,a);
  }
  if(a==='coast'){footprint(4*TS,4*TS-10);footprint(7*TS,5*TS-12)}
  if(a==='giant'){giantHut(2,18);giantHut(114,16);fruitPile(46,82);fruitPile(100,98);fruitPile(30,112)}
  if(a==='pipopa'){sign(1*TS,6*TS,'inn');sign(8*TS,6*TS,'shop')}
  if(a==='castle')castleKeep();
  if(!ents)return;
  if(cut){cut.ents.slice().sort((p,q)=>p.y-q.y).forEach(e=>drawEnt(e,t));return}
  const list=[];
  areaNPC().forEach(n=>list.push({y:n.y,f:()=>PV[n.id]?drawPipo(n.x*TS,n.y*TS-2,PV[n.id],t+n.x*130):drawChar(CH[n.id],n.x*TS,n.y*TS-2,n.dir||'down',0,0)}));
  list.push({y:hero.y+(hero.ty-hero.y)*hero.t+.01,f:()=>{
    const fr=hero.moving?(hero.t<.5?1:2):0,X=Math.round(hx)-cx,Y=Math.round(hy)-cy;
    const onW=a==='ocean'||(a==='world'&&('~W'.includes(tile(a,hero.x,hero.y))||'~W'.includes(tile(a,hero.tx,hero.ty))));
    if(onW){const b=Math.floor(t/500)%2;if(flags.sail){shipTop(X,Y+b,t);drawChar(CH.hero,X-3,Y-7+b,hero.dir,0,heroEq());shipHull(X,Y+b)}else{raftSpr(X,Y+2+b);drawChar(CH.hero,X,Y-4+b,hero.dir,0,heroEq())}}
    else drawChar(CH.hero,X,Y-2,hero.dir,fr,heroEq());
  }});
  list.sort((p,q)=>p.y-q.y).forEach(o=>o.f());
  if(faceC&&!busy&&!menuOpen&&!hero.moving){   /* 調べられる相手の上に しるしを出す */
    const mx=(hero.x+DV[hero.dir][0])*TS-cx+6,my=(hero.y+DV[hero.dir][1])*TS-cy-7+(Math.floor(t/300)%2);
    R('#0d1626',mx-1,my-1,6,5);R('#ffd98a',mx,my,4,1);R('#ffd98a',mx+1,my+1,2,1);R('#ffd98a',mx+1,my+2,2,1);
  }
}

    else if(coast){R('#2d7fd3',0,56,W,8);R('#ecd9a0',0,64,W,80);R('#d9c383',0,64,W,2)}

  const n=bt.es.length;
  bt.es.forEach((e,i)=>{

    if(e.alpha>0)R('rgba(0,0,0,.2)',ex+6,base,sw-12,3);
    const vis=!(e.blink>0&&Math.floor(e.blink/55)%2===0);
    if(vis&&e.alpha>0){g.globalAlpha=e.alpha;g.drawImage(sp,ex,ey,sw,sh);
      if(e.key==='nushi'&&!e.dying){   /* 燃えまくる：体じゅうから 火の粉が 立ちのぼる */
        const C=['#fff3b0','#ffd04a','#f6902a','#d8342a'];
        for(let i=0;i<26;i++){
          const life=((t/9+i*41)%64)/64,fx=ex+4+((i*29)%(sw-8))+Math.round(Math.sin(t/130+i)*2),fy=ey+sh-10-Math.round(life*(sh+6))+((i*13)%14);
          const s2=life<.5?2:1;R(C[Math.min(3,Math.floor(life*4))],fx&~1,fy&~1,s2*2>>1<<1||2,2);
        }
        for(let i=0;i<8;i++){const fl=Math.floor(t/90+i*3)%3;R(fl?'#ffd04a':'#f6902a',ex+6+i*((sw-12)/7)|0,ey+sh-2-fl*2,2,2+fl*2)}
      }
      if(e.key==='karakuri'&&!e.dying){   /* 歯車が カチカチ回り、目が ときどき強く光る */
        const f=Math.floor(t/220)%2,u=sc,A='#f6c945',B='#8a6a3c';
        R(f?A:B,ex+7*u,ey+12*u,2*u,u);R(f?A:B,ex+7*u,ey+14*u,2*u,u);R(f?B:A,ex+6*u,ey+13*u,u,u);R(f?B:A,ex+9*u,ey+13*u,u,u);

    if(!e.dying){const bx=ex+((sw-42)>>1),by=Math.max(11,ey-7);e.ty=by-10;R('#0d1626',bx,by,42,5);R('#3a2a2a',bx+1,by+1,40,3);R(e.hp/e.mhp>.35?'#58c4c0':'#ef6f5a',bx+1,by+1,Math.ceil(40*e.hp/e.mhp),3)}

/* ================= ループ ================= */
let last=0,hudC='',ctlC='',miniT=0,faceC=null;
function updHUD(){
  const gt=goalText(),an=mode==='title'?'海原':mode==='battle'?'戦闘':MAPS[area].name;
  const s=P.lv+'|'+P.hp+'|'+P.mhp+'|'+P.gold+'|'+P.mp+'|'+P.mmp+'|'+gt+'|'+an;if(s===hudC)return;hudC=s;
  $('hLv').textContent=P.lv;$('hHp').textContent=P.hp+'/'+P.mhp;$('hG').textContent=P.gold;$('hMp').textContent=P.mp;
  const b=$('hBar');b.style.width=(100*P.hp/P.mhp)+'%';b.classList.toggle('low',P.hp/P.mhp<=.35);
  $('mBar').style.width=(100*P.mp/P.mmp)+'%';
  $('hGoal').textContent=gt;$('hArea').textContent=an;
}
function updCtl(){
  let a='―',b='―',hot=false;
  faceC=null;
  if(paused){a='―';b='―'}
  else if(tcRes)a='すすむ';
  else if(tinRes)a='―';
  else if(chState){a='けってい';b=chState.cancel!=null?'もどる':'―'}
  else if(mode==='title')a=titleEl.hidden?'―':$('tCont').disabled?'はじめる':'つづきから';
  else if(menuOpen)b='とじる';
  else if(dS){a='おくる';b='おくる'}
  else if(mode==='map'&&!busy){b='メニュー';const f=hero.moving?null:facing();faceC=f;a=f||'しらべる';hot=!!f}
  const s=a+'|'+b+'|'+hot;if(s===ctlC)return;ctlC=s;
  $('lA').textContent=a;$('lB').textContent=b;
  $('bA').classList.toggle('hot',hot);$('bA').classList.toggle('idle',a==='―'||(a==='しらべる'&&!hot&&mode==='map'));$('bB').classList.toggle('idle',b==='―');
}
function updMini(ts){
  const on=!!set.mini&&mode==='map'&&area==='world'&&!menuOpen&&!dS&&!chState&&!cut;
  const c=$('mini');if(c.hidden===on)c.hidden=!on;
  if(on&&ts-miniT>350){miniT=ts;drawMini(c);if(Math.floor(ts/350)%2){const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(hero.x,hero.y,1,1)}}
}
function frame(ts){
  const dt=Math.min(50,ts-last||16);last=ts;
  pollPad();
  if(paused){updCtl();requestAnimationFrame(frame);return}
  if(dS&&!dS.done){
    dS.acc+=dt;
    while(dS&&!dS.done&&dS.acc>set.spd){
      dS.acc-=set.spd;dS.i++;if(dS.i%3===0)SE.blip();
      if(dS.i>=dS.text.length)finishType();
    }
    if(dS&&!dS.done)dtext.textContent=dS.text.slice(0,dS.i);
  }
  if(fadeJob){
    const f=fadeJob;f.t+=dt;const k=Math.min(1,f.t/f.ms);fadeA=f.from+(f.to-f.from)*k;
    if(k>=1){fadeJob=null;f.r()}
  }
  if(bt)bt.es.forEach(e=>{if(e.blink>0)e.blink-=dt});
  tweens.forEach((w,e)=>{w.t+=dt;const k=Math.min(1,w.t/w.ms);e.x=w.fx+(w.x-w.fx)*k;e.y=w.fy+(w.y-w.fy)*k;if(k>=1)tweens.delete(e)});
  if(mode==='map'){
    if(hero.moving){
      hero.t+=dt/165;
      if(hero.t>=1){hero.moving=false;hero.x=hero.tx;hero.y=hero.ty;hero.t=0;onStep()}
    }else if(!busy&&!menuOpen&&held)tryMove(held);
  }
  updCtl();
  if(mode==='title')drawMap('ocean',ts,false);
  else if(mode==='map')drawMap(area,ts,true);
  else if(mode==='battle'&&bt)drawBattle(ts);
  else R('#000',0,0,W,H);
  if(fadeA>0){g.globalAlpha=Math.min(1,fadeA);R('#000',0,0,W,H);g.globalAlpha=1}
  updHUD();updBui();updMini(ts);
  requestAnimationFrame(frame);
}
function fit(){
  const wrap=$('screen-wrap');   /* 上75%の #game-stage から HUD を引いた残りが画面枠 */
  let sw=Math.max(160,Math.floor(Math.min(wrap.clientWidth-22,(wrap.clientHeight-72)*10/9,640)));
  const k=Math.floor(sw/160)*160;if(k>=sw*.82)sw=k;   /* 整数倍に寄せてドット幅をそろえる */
  scr.style.width=sw+'px';scr.style.height=Math.round(sw*.9)+'px';scr.style.setProperty('--u',(sw/160)+'px');wrap.style.setProperty('--sw',sw+'px');
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));

if(location.hash==='#debug')window.__kyojin=()=>({warp:(ar,x,y)=>{area=ar;hero.x=hero.tx=x;hero.y=hero.ty=y},bgm:bgm.k,bgmI:bgm.i,P,flags,area,mode,x:hero.x,y:hero.y,busy,bt:bt?bt.es.map(e=>[e.key,e.hp,e.next]):null,dlg:dS?dS.text:null,ch:chState?chState.n:0});
newGame();fit();
$('bSel').classList.toggle('off',mute);$('lSel').textContent=mute?'音 OFF':'音 ON';
$('tCont').disabled=!loadSave();
if(location.hash==='#debug')$('tPipo').hidden=false;
setBgm('sea');
requestAnimationFrame(frame);
})();
