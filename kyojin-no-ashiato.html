<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>巨人の足跡 ― 島の戦士 第1章</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* 深海 / 流木 / 珊瑚 / 浅瀬 / 砂 / 墨 */
  --shell:#12324a; --shell-2:#0c2436; --trim:#c9a878; --ink:#f1e2b8;
  --coral:#ef6f5a; --shoal:#58c4c0; --sumi:#0d1626; --key:#1d4a69; --key-hi:#2b6187;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --shell:#d9c7a0; --shell-2:#c4ae82; --trim:#12324a; --ink:#12324a;
    --key:#12324a; --key-hi:#1d4a69;
  }
}
:root[data-theme="light"]{
  --shell:#d9c7a0; --shell-2:#c4ae82; --trim:#12324a; --ink:#12324a;
  --key:#12324a; --key-hi:#1d4a69;
}
:root[data-theme="dark"]{
  --shell:#12324a; --shell-2:#0c2436; --trim:#c9a878; --ink:#f1e2b8;
  --key:#1d4a69; --key-hi:#2b6187;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--shell);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--shoal);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;align-items:center;max-width:640px;margin:0 auto}

/* ---- HUD ---- */
#hud{
  flex:0 0 auto;width:100%;display:flex;align-items:center;gap:10px;
  padding:8px 12px;font-size:15px;line-height:1;
}
#hud .nm{white-space:nowrap}
#hud .hp{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
#hud .bar{flex:1;height:10px;background:var(--shell-2);border:2px solid var(--trim);min-width:30px}
#hud .bar i{display:block;height:100%;width:100%;background:var(--shoal);transition:width .25s}
#hud .bar i.low{background:var(--coral)}
#hud .gd{white-space:nowrap}
#bMute{width:34px;height:34px;border:2px solid var(--trim);border-radius:50%;font-size:16px}
#bMute.off{opacity:.45;text-decoration:line-through}

/* ---- Screen ---- */
#stage{flex:0 0 auto;width:100%;display:flex;justify-content:center;padding:0 8px}
#screen{
  position:relative;width:320px;height:288px;--u:2px;
  background:#000;border:3px solid var(--trim);border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 4px var(--shell-2);
}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#screen.shake{animation:shake .32s steps(6)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,3px)}}
@media (prefers-reduced-motion: reduce){#screen.shake{animation:none}}

.win{
  background:var(--sumi);color:#fff;
  border:calc(var(--u)*1) solid #fff;border-radius:calc(var(--u)*2);
  box-shadow:0 0 0 calc(var(--u)*1) var(--sumi);
}
#dlg{
  position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*3);
  min-height:calc(var(--u)*43);padding:calc(var(--u)*4) calc(var(--u)*5);
  font-size:calc(var(--u)*7.6);line-height:1.45;white-space:pre-wrap;
}
#dname{
  position:absolute;left:calc(var(--u)*4);top:calc(var(--u)*-8.5);
  padding:0 calc(var(--u)*3);font-size:calc(var(--u)*6.4);line-height:1.5;
  background:var(--sumi);border:calc(var(--u)*1) solid #fff;border-radius:calc(var(--u)*2);color:#ffd98a;
}
#dnext{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*1.5);font-size:calc(var(--u)*6);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(calc(var(--u)*1.5))}}
#choice{
  position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*3);
  display:flex;flex-direction:column;padding:calc(var(--u)*2);
  font-size:calc(var(--u)*7.6);min-width:calc(var(--u)*54);
}
#choice.grid{left:calc(var(--u)*3);display:grid;grid-template-columns:1fr 1fr}
#choice button{
  text-align:left;padding:calc(var(--u)*4) calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*10);
  position:relative;color:#fff;min-height:calc(var(--u)*19);
}
#choice button.sel::before{content:"▶";position:absolute;left:calc(var(--u)*2);color:#ffd98a}
#choice button:active{background:#22304d}
#tin{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*54);display:flex;gap:calc(var(--u)*2);padding:calc(var(--u)*2)}
#tin input{flex:1;min-width:0;font:inherit;font-size:max(16px,calc(var(--u)*7.6));background:#fff;color:#0d1626;border:0;border-radius:calc(var(--u)*1.5);padding:calc(var(--u)*2) calc(var(--u)*3);-webkit-user-select:text;user-select:text}
#tin button{color:#fff;border:calc(var(--u)*.8) solid #fff;border-radius:calc(var(--u)*2);padding:0 calc(var(--u)*5);font-size:calc(var(--u)*7.6)}
#toast{
  position:absolute;top:calc(var(--u)*4);left:50%;transform:translateX(-50%);
  padding:calc(var(--u)*1) calc(var(--u)*6);font-size:calc(var(--u)*7);white-space:nowrap;
  opacity:0;transition:opacity .4s;pointer-events:none;
}
#toast.on{opacity:1}

#title{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u)*3);background:linear-gradient(#0d1626cc,#0d162655 55%,#0d1626dd);color:#fff;text-align:center;
}
#title h1{margin:0;font-weight:400;font-size:calc(var(--u)*19);letter-spacing:.08em;line-height:1.15;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #0d1626}
#title p{margin:0;font-size:calc(var(--u)*7);color:#ffd98a}
#title .btns{display:flex;flex-direction:column;gap:calc(var(--u)*2.5);margin-top:calc(var(--u)*1)}
#title button{font-size:calc(var(--u)*7.5);padding:calc(var(--u)*2.6) calc(var(--u)*12);color:#fff}
#title button:active{background:#22304d}

#menu{
  position:absolute;inset:calc(var(--u)*4);padding:calc(var(--u)*5);
  font-size:calc(var(--u)*7);line-height:1.6;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
}
#menu h2{margin:0 0 calc(var(--u)*2);font-weight:400;font-size:calc(var(--u)*8);color:#ffd98a}
#menu dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 calc(var(--u)*6)}
#menu dt{color:#9fd6d3}#menu dd{margin:0}
#menu .goal{margin:calc(var(--u)*3) 0;padding-top:calc(var(--u)*3);border-top:calc(var(--u)*.6) dashed #fff8}
#menu .tabs{display:flex;gap:calc(var(--u)*2);margin-bottom:calc(var(--u)*3)}
#menu .tabs button{flex:1;border:calc(var(--u)*.8) solid #fff9;border-radius:calc(var(--u)*2);min-height:calc(var(--u)*15);color:#fff}
#menu .tabs button.on{background:#fff;color:var(--sumi)}
#menu .tabs button.x{flex:0 0 calc(var(--u)*17)}
#menu .ln{display:flex;align-items:center;gap:calc(var(--u)*3)}
#menu .ln .k{color:#9fd6d3;flex:0 0 calc(var(--u)*24)}
#menu .mb{flex:1;height:calc(var(--u)*5);background:#22304d;border:calc(var(--u)*.6) solid #fff}
#menu .mb i{display:block;height:100%;background:var(--shoal)}
#menu .mb i.x{background:#ffd98a}
#menu .mb i.low{background:var(--coral)}
#menu .two{display:grid;grid-template-columns:1fr 1fr;gap:0 calc(var(--u)*4)}
#menu .sm{color:#9fd6d3;font-size:calc(var(--u)*6)}
#menu h3{margin:calc(var(--u)*3) 0 0;font-weight:400;font-size:calc(var(--u)*6.4);color:#ffd98a;border-bottom:calc(var(--u)*.6) solid #fff5}
#menu .it{display:flex;align-items:center;width:100%;text-align:left;gap:calc(var(--u)*2);color:#fff;min-height:calc(var(--u)*15);border-bottom:calc(var(--u)*.5) dashed #fff3}
#menu button.it:active{background:#22304d}
#menu .it .e{flex:0 0 calc(var(--u)*8);color:#0d1626;background:#ffd98a;text-align:center;border-radius:calc(var(--u)*1.5);line-height:1.3}
#menu .it .e.off{background:none}
#menu .it .fx{margin-left:auto;color:#9fd6d3;white-space:nowrap}
#mMap{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;border:calc(var(--u)*.8) solid #fff;margin-top:calc(var(--u)*2)}
#menu .cap{color:#9fd6d3;margin-top:calc(var(--u)*3)}
#menu .row{display:flex;flex-wrap:wrap;gap:calc(var(--u)*3);margin-top:calc(var(--u)*3)}
#menu .row button{border:calc(var(--u)*.8) solid #fff;border-radius:calc(var(--u)*2);padding:calc(var(--u)*3) calc(var(--u)*5);color:#fff;min-height:calc(var(--u)*18)}
#menu .row button:disabled,#menu button.it:disabled{opacity:.4}
#menu .row button.warn{border-color:var(--coral);color:var(--coral)}

/* ---- タイトルコール ---- */
#tc{position:absolute;inset:0;background:#05080f;overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
#tc .slash{position:absolute;left:-20%;right:-20%;top:50%;height:calc(var(--u)*46);margin-top:calc(var(--u)*-23);background:var(--coral);transform:skewY(-6deg);animation:tcSl .38s cubic-bezier(.2,.9,.2,1) both}
#tc .edge{position:absolute;left:-20%;right:-20%;top:50%;height:calc(var(--u)*1.5);background:#fff;transform:skewY(-6deg);animation:tcSr .5s .15s cubic-bezier(.2,.9,.2,1) both}
#tc .edge.a{margin-top:calc(var(--u)*-27)}#tc .edge.b{margin-top:calc(var(--u)*25.5)}
#tc .tc-sub{position:relative;font-size:calc(var(--u)*8);letter-spacing:.3em;margin-bottom:calc(var(--u)*9);animation:tcL .4s .3s cubic-bezier(.2,.9,.2,1) both}
#tc h2{position:relative;margin:0;font-weight:400;font-size:calc(var(--u)*24);letter-spacing:.06em;line-height:1.2;white-space:nowrap;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #05080f;animation:tcR .45s .5s cubic-bezier(.15,1.25,.3,1) both}
#tc .tc-name{position:relative;font-size:calc(var(--u)*9);margin-top:calc(var(--u)*11);color:#ffd98a;letter-spacing:.2em;animation:tcL .4s 1.15s cubic-bezier(.2,.9,.2,1) both}
#tc .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:tcF .5s .92s both;pointer-events:none}
#tc .tc-next{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*4);font-size:calc(var(--u)*6);animation:bob .7s steps(2) infinite}
@keyframes tcSl{from{transform:translateX(-130%) skewY(-6deg)}}
@keyframes tcSr{from{transform:translateX(130%) skewY(-6deg)}}
@keyframes tcL{from{transform:translateX(-150%);opacity:0}}
@keyframes tcR{from{transform:translateX(150%) skewX(-20deg)}}
@keyframes tcF{0%{opacity:.9}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){#tc *{animation:none!important}}

/* ---- Pad ---- */
#pad{
  flex:1 1 auto;min-height:180px;width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:8px 22px 14px;
}
#dpad{position:relative;width:148px;height:148px;touch-action:none;flex:0 0 auto}
#dpad i{position:absolute;background:var(--key);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px;color:var(--shell)}
#dpad .u,#dpad .d{left:50px;width:48px;height:52px}
#dpad .l,#dpad .r{top:50px;height:48px;width:52px}
#dpad .u{top:0;border-radius:10px 10px 0 0}#dpad .d{bottom:0;border-radius:0 0 10px 10px}
#dpad .l{left:0;border-radius:10px 0 0 10px}#dpad .r{right:0;border-radius:0 10px 10px 0}
#dpad .c{left:50px;top:50px;width:48px;height:48px}
#dpad i::after{color:#f1e2b8;opacity:.8}
#dpad .u::after{content:"▲"}#dpad .d::after{content:"▼"}#dpad .l::after{content:"◀"}#dpad .r::after{content:"▶"}
#dpad[data-d="up"] .u,#dpad[data-d="down"] .d,#dpad[data-d="left"] .l,#dpad[data-d="right"] .r{background:var(--key-hi)}
.ab{display:flex;align-items:flex-end;gap:14px;flex:0 0 auto}
.ab button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.ab b{display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:400;color:#fff}
#bB b{width:60px;height:60px;background:var(--key);font-size:22px}
#bA b{width:82px;height:82px;background:var(--coral);font-size:30px;margin-bottom:26px}
#bA{margin-bottom:0}
.ab button:active b{transform:translateY(3px);filter:brightness(1.2)}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="nm">戦士 Lv<b id="hLv">1</b></div>
    <div class="hp"><span>HP</span><div class="bar"><i id="hBar"></i></div><b id="hHp">24/24</b></div>
    <div class="gd">貝<b id="hG">0</b></div>
    <button id="bMute" aria-label="サウンド切り替え">♪</button>
  </header>

  <main id="stage">
    <div id="screen">
      <canvas id="cv" width="160" height="144"></canvas>
      <div id="toast" class="win"></div>
      <div id="choice" class="win" hidden></div>
      <div id="dlg" class="win" hidden><div id="dname"></div><div id="dtext"></div><div id="dnext">▼</div></div>
      <div id="tin" class="win" hidden><input id="tinI" type="text" maxlength="12" placeholder="合言葉を入力" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="tinB">決定</button></div>
      <div id="menu" class="win" hidden></div>
      <div id="tc" hidden>
        <div class="slash"></div><div class="edge a"></div><div class="edge b"></div>
        <div class="tc-sub">島の戦士と</div>
        <h2>巨人の足跡</h2>
        <div class="tc-name">はじまり</div>
        <div class="flash"></div>
        <div class="tc-next" id="tcNext" hidden>▼</div>
      </div>
      <div id="title">
        <h1>巨人の足跡</h1>
        <p>島の戦士　第1章</p>
        <div class="btns">
          <button id="tNew" class="win">はじめから</button>
          <button id="tCont" class="win" hidden>つづきから</button>
          <button id="tCh2" class="win">オープニングをみる</button>
          <button id="tPipo" class="win">確認用スタート</button>
        </div>
      </div>
    </div>
  </main>

  <footer id="pad">
    <div id="dpad" aria-label="十字キー"><i class="u"></i><i class="l"></i><i class="c"></i><i class="r"></i><i class="d"></i></div>
    <div class="ab">
      <button id="bB" aria-label="メニュー"><b>B</b><span>メニュー</span></button>
      <button id="bA" aria-label="決定・話す・調べる"><b>A</b></button>
    </div>
  </footer>
</div>

function tone(f,d,o={}){
  if(!AC||mute)return;
  try{
    const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),gn=AC.createGain();
    os.type=o.type||'square';os.frequency.setValueAtTime(f,t);

    gn.gain.setValueAtTime(o.v||.06,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    os.connect(gn);gn.connect(AC.destination);os.start(t);os.stop(t+d+.03);
  }catch(e){}
}

function walkable(a,x,y){
  const c=tile(a,x,y);
  if(a==='ocean')return c==='~';
  if(a==='world')return '~.,sVYO'.includes(c);
  return '.,sfF_m<>g'.includes(c);
}

function tryMove(d){
  hero.dir=d;const nx=hero.x+DV[d][0],ny=hero.y+DV[d][1];
  if(nx<0||ny<0||nx>=mw(area)||ny>=mh(area)){
    if(area==='ocean'||area==='world'){run(()=>say('','霧が濃くて\nこれ以上は 進めない……'));return}
    if(area==='pipopa'){run(()=>changeArea('world',VIL[0],VIL[1],'down'));return}
    if(area.startsWith('pin')){const r=RET[area];run(()=>changeArea('pipopa',r[0],r[1],'down'));return}
    if(area==='hide1'){run(()=>changeArea('world',HIDE[0],HIDE[1],'down'));return}
    if(area==='castle'){run(()=>changeArea('world',CAS[0],CAS[1],'down'));return}
    if(area.startsWith('hide'))return;
    const m=MAPS[area],nb=Object.keys(MAPS).find(k=>MAPS[k].gx===m.gx+DV[d][0]&&MAPS[k].gy===m.gy+DV[d][1]);
    if(!nb)return;
    const wx=(nx+MW)%MW,wy=(ny+MH)%MH;
    if(walkable(nb,wx,wy))run(()=>changeArea(nb,wx,wy));
    return;
  }
  const c=tile(area,nx,ny);
  if(bump(c))return;
  if(area==='world'){
    const W_=mw('world');
    if(c==='~'&&deep[ny*W_+nx]&&!deep[hero.y*W_+hero.x]&&!flags.afloat){toast('海流が はげしくて 沖へは 出られない');return}
    const cur=tile(area,hero.x,hero.y),cw=cur==='~',nw=c==='~';
    if(cw!==nw&&(cw?c:cur)!=='s'){if(cw&&'.,VTMYO'.includes(c))toast('上陸できるのは 砂地だけ');return}
  }
  if(walkable(area,nx,ny)&&!npcAt(nx,ny)){hero.tx=nx;hero.ty=ny;hero.t=0;hero.moving=true}
}

function onStep(){
  steps++;sinceB++;
  const c=tile(area,hero.x,hero.y);
  if(c==='F'&&!flags.foot){run(footEv);return}
  if(c==='>'||c==='<'){const to='hide'+(+area.slice(4)+(c==='>'?1:-1)),q=findTile(to,c==='>'?'<':'>');run(()=>changeArea(to,q[0],q[1]));return}
  if(area==='castle'&&c==='g'&&flags.gate===1&&hero.dir==='down'){run(gateBackEv);return}
  let enc=MAPS[area].enc,bg=area.startsWith('hide')?'cave':area,rate=area.startsWith('hide')?.09:.115;
  if(area==='world'){
    reveal();
    if(c==='V'){flags.pv=1;run(()=>changeArea('pipopa',4,8,'up'));return}
    if(c==='O'){run(()=>changeArea('castle',4,8,'up'));return}
    if(c==='Y'){run(async()=>{await changeArea('hide1',4,8,'up');if(!flags.guard)await guardEv()});return}
    if(c==='s'&&hero.x>=33&&hero.y>=22&&hero.y<=25&&!flags.kuju){flags.kuju=1;toast('九十九里浜')}
    if(flags.afloat&&Math.hypot(hero.x-HOME[0],hero.y-HOME[1])>=3){run(driftEv);return}
    rate=.07;
    if(c==='~'){enc=['jelly'];bg='ocean'}else{enc=hero.x<=24?['tsuchi','bigmush','wasp','tsuchi']:['wasp','bigmush','mush'];bg=c==='s'?'coast':'meadow'}
  }
  if(enc&&flags.morn!==1&&sinceB>4&&Math.random()<rate){const k=enc[rnd(0,enc.length-1)];run(()=>fieldBattle(k,bg));return}
  if(steps%12===0)save();
}
function interact(){
  const dx=DV[hero.dir][0],dy=DV[hero.dir][1],fx=hero.x+dx,fy=hero.y+dy,inb=(x,y)=>x>=0&&y>=0&&x<mw(area)&&y<mh(area);
  if(inb(fx,fy)){
    const c=tile(area,fx,fy);let n=npcAt(fx,fy);
    if(!n&&c==='c'&&inb(fx+dx,fy+dy))n=npcAt(fx+dx,fy+dy);
    if(n){n.dir={up:'down',down:'up',left:'right',right:'left'}[hero.dir];run(()=>n.ev?n.ev():talk(n.id));return}
    if(bump(c))return;
    const ex=examText(c);if(ex){run(()=>say('',ex));return}
  }
  if(tile(area,hero.x,hero.y)==='F')run(footEv);
}

/* ================= 戦闘 ================= */
async function battle(keys,opt={}){
  if(!Array.isArray(keys))keys=[keys];
  const es=keys.map((k,i)=>Object.assign({key:k},EN[k],{mhp:EN[k].hp,alpha:1,blink:0,dying:false,critN:0,label:EN[k].name+(keys.length>1?'ABC'[i]:'')}));
  const alive=()=>es.filter(e=>e.hp>0);
  const prev=mode;SE.enc();await fadeTo(1,170);
  bt={es,bg:opt.bg||area};mode='battle';await fadeTo(0,170);
  await say('',es.length>1?`${es[0].name}が ${es.length}人 あらわれた！`:`${es[0].name}が あらわれた！`);
  let res=null,stun=false;
  while(!res){
    let guard=false,c=-1;
    if(stun){stun=false;await say('','糸が からまって\n動けない！')}
    else c=await choose(['たたかう','ぼうぎょ',`やくそう ${P.herb}`,'にげる'],{grid:true});
    if(c===0){
      let al=alive(),tg=al[0];
      if(al.length>1)tg=al[await choose(al.map(e=>e.label))];
      const cr=Math.random()<1/12;let dm=Math.max(1,atk()-(tg.def>>1)+rnd(0,3));if(cr)dm*=2;
      cr?SE.crit():SE.hit();tg.blink=320;tg.hp=Math.max(0,tg.hp-dm);
      await say('',(cr?'かいしんの 一撃！！\n':'あなたの 攻撃！\n')+`${tg.label}に ${dm}の ダメージ！`);
      if(tg.hp<=0){tg.dying=true;SE.win();await say('',`${tg.label}を たおした！`)}
    }else if(c===1){
      guard=true;await say('','あなたは 身を守っている。');
    }else if(c===2){
      if(P.herb<=0){await say('','やくそうを 持っていない！');continue}
      P.herb--;const h=Math.min(15,P.mhp-P.hp);P.hp+=h;SE.heal();
      await say('',`やくそうを 使った！\nHPが ${h} 回復した！`);
    }else if(c===3){
      if(opt.noRun){await say('','これは 真剣勝負だ。\n逃げるわけには いかない！');continue}
      if(Math.random()<.65){SE.run();await say('','うまく 逃げきれた！');res='run';break}
      await say('','しかし まわりこまれてしまった！');
    }
    if(!alive().length){
      if(!opt.noReward){
        const ex=es.reduce((a,e)=>a+e.exp,0),gd=es.reduce((a,e)=>a+e.g,0);
        P.exp+=ex;P.gold+=gd;
        await say('',`経験値 ${ex}、貝がら ${gd}まいを\n手に入れた！`);
        while(P.lv<=LV.length-1&&P.exp>=LV[P.lv]){
          P.lv++;P.mhp+=5;P.atk+=2;P.def+=1;P.hp=P.mhp;SE.lvl();
          await say('',`レベルが ${P.lv}に 上がった！\n最大HP+5　攻撃+2　防御+1`);
        }
      }
      res='win';break;
    }
    for(const e of alive()){
      if(e.web&&!stun&&Math.random()<.28){stun=true;SE.whoosh();await say('',`${e.label}は 糸を はいた！\nあなたは 糸に からまった！`);continue}
      const cr=!!e.crits&&e.critN<e.crits;if(cr)e.critN++;
      let dm=cr?e.atk+rnd(0,2):Math.max(1,e.atk-(def()>>1)+rnd(0,2));if(guard)dm=Math.ceil(dm/2);
      if(opt.safe)dm=Math.min(dm,Math.max(0,P.hp-1));
      if(dm>0){P.hp=Math.max(0,P.hp-dm);cr?SE.crit():SE.hurt();shake();
        await say('',(cr?`${e.label}の 会心の一撃！！\n`:`${e.label}の 攻撃！\n`)+`あなたは ${dm}の ダメージを うけた！`)}
      else await say('',`${e.label}の 攻撃！\nあなたは ひらりと かわした！`);
      if(P.hp<=0){await say('','あなたは 力つきた……');res='lose';break}
    }
  }
  await fadeTo(1,170);mode=prev;bt=null;if(prev!=='black')await fadeTo(0,170);else fadeA=0;
  return res;
}

function R(c,x,y,w,h){g.fillStyle=c;g.fillRect(x,y,w,h)}
function hsh(x,y,s){let h=Math.imul(x+11,374761393)^Math.imul(y+7,668265263)^Math.imul(s+3,982451653);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function speck(col,px,py,x,y,n,s){for(let i=0;i<n;i++)R(col,px+Math.floor(hsh(x,y,s+i)*15),py+Math.floor(hsh(y,x,s+i+9)*15),1,1)}
function grass(px,py,x,y){R('#63b24c',px,py,16,16);speck('#4f9a3d',px,py,x,y,5,1);speck('#80cb66',px,py,x,y,3,20)}
function snowG(px,py,x,y){R('#e8f1f8',px,py,16,16);speck('#c3d3e3',px,py,x,y,5,44);speck('#fff',px,py,x,y,3,48)}
function sand(px,py,x,y){R('#ecd9a0',px,py,16,16);speck('#d9c383',px,py,x,y,5,40)}
function water(px,py,x,y,t){
  R('#2d7fd3',px,py,16,16);const k=Math.floor(t/480)%4;
  for(let i=0;i<2;i++)R('#86c5f6',px+Math.floor(hsh(x,y,i+k*7)*11),py+Math.floor(hsh(y,x,i+3+k*5)*14),4,1);
}
function raftSpr(px,py){
  R('#8a5a2b',px+1,py+4,14,9);
  for(let i=0;i<4;i++){R('#c08a45',px+1,py+4+i*2+(i>1?1:0),14,2);R('#9c6a30',px+1,py+5+i*2+(i>1?1:0),14,1)}
  R('#5a3a1a',px+3,py+3,1,11);R('#5a3a1a',px+12,py+3,1,11);
}
function drawTile(c,px,py,x,y,t,a){
  const G=(a==='world'&&y<=17)?snowG:grass,cave=a.startsWith('hide');

    const px=x*TS-cx,py=y*TS-cy;
    if(a==='world'&&!seen[y*w+x])fog(px,py,x,y);else drawTile(m[y][x],px,py,x,y,t,a);
  }
  if(a==='coast'){footprint(4*TS,4*TS-10);footprint(7*TS,5*TS-12)}
  if(a==='giant'){giantHut(2,18);giantHut(114,16);fruitPile(46,82);fruitPile(100,98);fruitPile(30,112)}
  if(a==='pipopa'){sign(1*TS,6*TS,'inn');sign(8*TS,6*TS,'shop')}
  if(a==='castle')castleKeep();
  if(!ents)return;
  if(cut){cut.ents.slice().sort((p,q)=>p.y-q.y).forEach(e=>drawEnt(e,t));return}
  const list=[];
  areaNPC().forEach(n=>list.push({y:n.y,f:()=>PV[n.id]?drawPipo(n.x*TS,n.y*TS-2,PV[n.id],t+n.x*130):drawChar(CH[n.id],n.x*TS,n.y*TS-2,n.dir||'down',0,0)}));
  list.push({y:hero.y+(hero.ty-hero.y)*hero.t+.01,f:()=>{
    const fr=hero.moving?(hero.t<.5?1:2):0,X=Math.round(hx)-cx,Y=Math.round(hy)-cy;
    const onW=a==='ocean'||(a==='world'&&(tile(a,hero.x,hero.y)==='~'||tile(a,hero.tx,hero.ty)==='~'));
    if(onW){const b=Math.floor(t/500)%2;raftSpr(X,Y+2+b);drawChar(CH.hero,X,Y-4+b,hero.dir,0,heroEq())}
    else drawChar(CH.hero,X,Y-2,hero.dir,fr,heroEq());
  }});
  list.sort((p,q)=>p.y-q.y).forEach(o=>o.f());
}
function drawBattle(t){
  const b=bt.bg,sea=b==='ocean',coast=b==='coast',forest=b==='forest',cave=b==='cave';
  if(cave){
    R('#141c30',0,0,W,62);for(let i=0;i<8;i++){const hh=6+Math.floor(hsh(i,3,7)*14);R('#2c3a55',i*22-4,0,12,hh);R('#e8f1f8',i*22-1,hh-2,3,3)}
    R('#55627d',0,62,W,82);R('#6f7d99',0,62,W,2);
  }else{
    R(forest?'#1f4d3a':'#8fd0ff',0,0,W,62);
    if(!forest){R('#fff',18,14,22,5);R('#fff',24,10,12,4);R('#fff',112,24,26,5);R('#fff',120,20,12,4)}
    else for(let i=0;i<7;i++){R('#173b2c',i*26-6,10,18,52);R('#256b2c',i*26-12,0,30,22)}
    if(sea){R('#2d7fd3',0,62,W,82);for(let i=0;i<10;i++)R('#86c5f6',(i*37+Math.floor(t/300)*3)%W,66+i*8,8,1)}
    else if(coast){R('#2d7fd3',0,56,W,8);R('#ecd9a0',0,64,W,80);R('#d9c383',0,64,W,2)}
    else{R(forest?'#2f6b35':'#63b24c',0,62,W,82);R(forest?'#255a2c':'#4f9a3d',0,62,W,2)}
  }
  const n=bt.es.length;
  bt.es.forEach((e,i)=>{
    const sp=SPC[e.chr?e.key:(e.spr||e.key)],sc=e.chr?(e.sc||3):(e.sc||4),sw=sp.width*sc,sh=sp.height*sc,base=e.base||77;
    if(e.dying)e.alpha=Math.max(0,e.alpha-.04);
    const ex=Math.round(W/2+(n>1?(i-(n-1)/2)*60:0)-sw/2),ey=base-sh+(e.dying?0:Math.round(Math.sin(t/380+i*1.7)*2));
    if(e.alpha>0)R('rgba(0,0,0,.2)',ex+6,base,sw-12,3);
    const vis=!(e.blink>0&&Math.floor(e.blink/55)%2===0);
    if(vis&&e.alpha>0){g.globalAlpha=e.alpha;g.drawImage(sp,ex,ey,sw,sh);g.globalAlpha=1}
    if(!e.dying){const bx=ex+((sw-42)>>1),by=Math.max(2,ey-7);R('#0d1626',bx,by,42,5);R('#3a2a2a',bx+1,by+1,40,3);R(e.hp/e.mhp>.35?'#58c4c0':'#ef6f5a',bx+1,by+1,Math.ceil(40*e.hp/e.mhp),3)}
  });
}

/* ================= ループ ================= */
let last=0,hudC='';
function updHUD(){
  const s=P.lv+'|'+P.hp+'|'+P.mhp+'|'+P.gold;if(s===hudC)return;hudC=s;
  $('hLv').textContent=P.lv;$('hHp').textContent=P.hp+'/'+P.mhp;$('hG').textContent=P.gold;
  const b=$('hBar');b.style.width=(100*P.hp/P.mhp)+'%';b.classList.toggle('low',P.hp/P.mhp<=.35);
}
function frame(ts){
  const dt=Math.min(50,ts-last||16);last=ts;
  if(dS&&!dS.done){
    dS.acc+=dt;
    while(dS&&!dS.done&&dS.acc>24){
      dS.acc-=24;dS.i++;if(dS.i%3===0)SE.blip();
      if(dS.i>=dS.text.length)finishType();
    }
    if(dS&&!dS.done)dtext.textContent=dS.text.slice(0,dS.i);
  }
  if(fadeJob){
    const f=fadeJob;f.t+=dt;const k=Math.min(1,f.t/f.ms);fadeA=f.from+(f.to-f.from)*k;
    if(k>=1){fadeJob=null;f.r()}
  }
  if(bt)bt.es.forEach(e=>{if(e.blink>0)e.blink-=dt});
  tweens.forEach((w,e)=>{w.t+=dt;const k=Math.min(1,w.t/w.ms);e.x=w.fx+(w.x-w.fx)*k;e.y=w.fy+(w.y-w.fy)*k;if(k>=1)tweens.delete(e)});
  if(mode==='map'){
    if(hero.moving){
      hero.t+=dt/165;
      if(hero.t>=1){hero.moving=false;hero.x=hero.tx;hero.y=hero.ty;hero.t=0;onStep()}
    }else if(!busy&&!menuOpen&&held)tryMove(held);
  }
  if(mode==='title')drawMap('ocean',ts,false);
  else if(mode==='map')drawMap(area,ts,true);
  else if(mode==='battle'&&bt)drawBattle(ts);
  else R('#000',0,0,W,H);
  if(fadeA>0){g.globalAlpha=Math.min(1,fadeA);R('#000',0,0,W,H);g.globalAlpha=1}
  updHUD();
  requestAnimationFrame(frame);
}
function fit(){
  const app=$('app'),hudH=$('hud').offsetHeight;
  const sw=Math.max(200,Math.floor(Math.min(app.clientWidth-22,(app.clientHeight-hudH-196)*10/9,600)));
  scr.style.width=sw+'px';scr.style.height=Math.round(sw*.9)+'px';scr.style.setProperty('--u',(sw/160)+'px');
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));

newGame();fit();
$('tCont').hidden=!loadSave();
requestAnimationFrame(frame);
})();
</script>
